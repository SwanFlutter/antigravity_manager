[workspace]
resolver = "2"
members = [
    "crates/contract",
    "crates/core",
    "crates/google",
    "crates/proxy",
    "crates/host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "tokio",
] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
